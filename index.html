<!DOCTYPE html>
<html lang="hi" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1318" />
    <meta name="description" content="डीज़ल मैकेनिक स्किल लैब — Diesel Mechanic Skill Lab: interactive, bilingual workshop training." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>डीज़ल मैकेनिक स्किल लैब · Diesel Mechanic Skill Lab</title>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('diesel-skill-lab:v1') || '{}');
        if (s.theme) document.documentElement.dataset.theme = s.theme;
        var manual = sessionStorage.getItem('diesel-skill-lab:manual-lang');
        document.documentElement.lang = manual === 'en' ? 'en' : 'hi';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
